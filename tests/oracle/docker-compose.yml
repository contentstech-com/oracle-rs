services:
  oracle:
    image: gvenzl/oracle-xe:11-slim
    platform: linux/amd64
    container_name: oracle-rs-test
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle_rs_test
      APP_USER: testuser
      APP_USER_PASSWORD: testpass
    volumes:
      - ./init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
